<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Codex plugin directory filtered to Local Plugins</title>
  <desc id="desc">Illustration of the Codex plugin browser showing the Local Plugins filter selected.</desc>
  <rect width="960" height="360" fill="#f7f6f2"/>
  <text x="480" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#151515">Make Codex work your way</text>
  <rect x="32" y="112" width="624" height="38" rx="12" fill="#ffffff" stroke="#d9d5cf"/>
  <circle cx="52" cy="131" r="8" fill="none" stroke="#8f8a83" stroke-width="2"/>
  <line x1="58" y1="137" x2="64" y2="143" stroke="#8f8a83" stroke-width="2"/>
  <text x="70" y="137" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#8f8a83">Search plugins</text>
  <rect x="670" y="110" width="190" height="42" rx="14" fill="#f1efeb" stroke="#d9d5cf"/>
  <text x="695" y="137" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#151515">Local Plugins</text>
  <path d="M833 127 l8 8 l8 -8" fill="none" stroke="#66615b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="870" y="110" width="54" height="42" rx="14" fill="#f1efeb" stroke="#d9d5cf"/>
  <text x="887" y="137" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#151515">All</text>
  <path d="M910 127 l6 6 l6 -6" fill="none" stroke="#66615b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="214" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#252525">Step 1</text>
  <text x="24" y="240" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#151515">Switch the source filter to Local Plugins</text>
  <text x="24" y="274" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#44403c">If the menu says Built by OpenAI, open it and choose Local Plugins before searching for HOTL.</text>
